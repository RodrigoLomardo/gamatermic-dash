[project]
name = "gamatermic-dash-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "charset-normalizer>=3.3",
  "openpyxl>=3.1",
  "cryptography>=42",
  "prometheus-client>=0.20",
  "email-validator>=2.1",
  "httpx>=0.27",  # cliente da Groq (ADR 0010)
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "hypothesis>=6.100",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "B904"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Routers nao tocam repositories"
type = "forbidden"
source_modules = ["app.modules.*.router"]
forbidden_modules = ["app.modules.*.repository"]
allow_indirect_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
